// The protobus built-in custom types.
//
// These are declared at the ROOT of the type namespace (no package) on
// purpose: the TypeScript, Python and Go ports register them as `.bigint` and
// `.timestamp`, so a shared .proto can write `bigint amount = 1;` and every
// port resolves the same name to the same wire format. Do not add a package.
//
// Shared schemas do not need to import this file. protobus tooling (the
// `protobus-cpp` CLI and MessageFactory) injects the import when a schema
// uses either type without declaring it. Projects running protoc or buf
// directly add `import "protobus/types.proto";` themselves.
//
// `optional` gives the inner value explicit presence so a zero is still
// written, byte-for-byte as the TypeScript reference writes it. It has no
// effect on what any port decodes.
syntax = "proto3";

// An unsigned integer up to 2^256-1 (uint256-compatible), carried as exactly
// 32 bytes, big-endian. Negative values and values that do not fit are
// refused when encoding, and anything wider than 32 bytes when decoding.
message bigint {
  optional bytes value = 1;
}

// An instant, carried as signed milliseconds since the Unix epoch. This is
// not google.protobuf.Timestamp: it has millisecond precision and no
// separate nanos field.
message timestamp {
  optional int64 value = 1;
}
